apiVersion: v1
kind: Service
metadata:
  name: {{ include "crr.fullname" . }}
  labels:
    {{- include "crr.labels" . | nindent 4 }}
spec:
  type: ClusterIP   # never exposed: open it through the Rancher service proxy or kubectl port-forward
  selector:
    {{- include "crr.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "crr.fullname" . }}
  labels:
    {{- include "crr.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
