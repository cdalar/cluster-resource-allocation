# Registry for the image and for the chart the Fleet HelmOp installs downstream: one place for a mirror or proxy
# of Docker Hub (e.g. Artifactory). Both addresses are built from Docker Hub's paths:
#   image  <registry>/cdalar/cluster-resource-report:<appVersion>
#   chart  oci://<registry>/cdalar/cluster-resource-report-chart   (rancher.deployDownstream)
# docker.io = public Docker Hub (the chart then comes from registry-1.docker.io). A scheme (oci://, https://) and a
# trailing slash are ignored; a path prefix works, e.g. repo.development.int/dockerhub. GHCR instead: set image.repository
# and rancher.deployDownstream.chart.repo (ghcr.io/cdalar/cluster-resource-report, oci://ghcr.io/cdalar/charts/...).
registry: docker.io

# Image built from discovery/Dockerfile.
image:
  repository: ""     # "" = <registry>/cdalar/cluster-resource-report; set to override (any registry/path)
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Display name of this cluster. Default: Rancher cluster name (if rancher.isLocalCluster or
# rancher.localKubeconfigSecret is set),
# otherwise "in-cluster".
clusterName: ""

collection:
  interval: 30m      # time between collections
  window: 7d         # Prometheus usage history window (Rancher Monitoring keeps ~10d by default)
  step: 5m           # Prometheus subquery resolution; use 15m on large clusters
  projectLabel: ""   # namespace label to group by when there is no Rancher Project (e.g. non-Rancher AKS)
  # Namespaces counted as System (platform) rather than Tenant/Unassigned, whatever their Rancher Project.
  # Must match the whole name; add names with "|" before the closing ")$". The keyword entries at the end
  # match any name containing "storage", "system" or "ingress" (local-path-storage, longhorn-system, ingress-nginx). "" = the same built-in list.
  systemNamespaceRegex: '^(kube-.*|cattle-.*|fleet-.*|rancher-.*|calico-.*|tigera-.*|kyverno|cert-manager|otel|monitoring|local|p-[a-z0-9]{5}|local-p-[a-z0-9]{5}|c-[a-z0-9-]+|u-[a-z0-9]+|user-[a-z0-9]+|rook-.*|openebs.*|csi-.*|.*-csi.*|.*provisioner.*|.*storage.*|.*system.*|.*ingress.*)$'
  # Rancher Projects whose namespaces all count as System, matched against the project name (ignoring case):
  # Rancher's System project and any project with "platform" in its name. The planner hides them like System.
  systemProjectRegex: '^(system|.*platform.*)$'

prometheus:
  enabled: true
  # Reached through the API server service proxy: <namespace>/<scheme>:<service>:<port>.
  # The chart grants services/proxy on exactly this service. Default: Rancher Monitoring.
  service: cattle-monitoring-system/http:rancher-monitoring-prometheus:9090
  # Or a direct URL (then `service` is not used and no proxy permission is created)
  url: ""
  # Optional bearer token for `url`, from an existing secret
  tokenSecret:
    name: ""
    key: token

rancher:
  # Installed on the Rancher local (management) cluster itself: project/cluster names are read from this cluster
  # (grants read on projects/clusters.management.cattle.io), no secret needed, and the local-only parts below
  # (publishNames, deployDownstream, planners) turn on. auto (default): detected at install -- local when the
  # cluster has Rancher's Project API and the Rancher server Deployment cattle-system/rancher. Detection needs a
  # real install/upgrade (Helm `lookup`); with `helm template`, a client dry run or Argo CD, set true or false.
  isLocalCluster: auto
  # Rancher local cluster only: a CronJob publishes the names to downstream clusters as a ConfigMap inside a
  # Fleet Bundle (no GitRepo). It may create/update only that one Bundle. On by default, but only rendered with
  # isLocalCluster; skipped on other clusters.
  publishNames:
    enabled: true
    schedule: "*/10 * * * *"
    workspace: fleet-default          # Fleet workspace: fleet-default = all downstream clusters
    targetNamespace: resource-report  # namespace of the ConfigMap on downstream clusters
    clusterSelector: null             # where the names go. null: the same targets as deployDownstream (its ClusterGroup,
                                      # clusters and clusterSelector), or every cluster when deployDownstream is off;
                                      # a Fleet clusterSelector instead, e.g. {} = every cluster in the workspace
    resources:                        # the CronJob's container
      requests: {cpu: 10m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
  # Rancher local cluster only (needs isLocalCluster): install this chart on chosen downstream clusters with one
  # Fleet HelmOp (an "App Bundle" in Continuous Delivery), no GitRepo. Fleet keeps the downstream releases at this
  # release's chart version, so `helm upgrade` here upgrades them too; uninstalling this release (or disabling
  # this) makes Fleet uninstall them. Needs Fleet >= 0.12 (Rancher 2.11+). Plan: docs/08-fleet-deployment.md.
  # On by default, but only rendered with isLocalCluster and Fleet HelmOps; skipped on other clusters. It installs
  # nothing until clusterGroup.clusterNames lists real clusters. Each key names the HelmOp field it sets.
  deployDownstream:
    enabled: true
    workspace: fleet-default          # metadata.namespace: Fleet workspace of the downstream clusters
    # spec.targets -- where to install. A cluster matching any of these gets the chart. By default only the
    # ClusterGroup below, whose placeholder cluster change-me matches nothing: nothing is installed until you
    # list clusters. With all three empty the chart fails.
    clusters: []                      # Fleet cluster names (kubectl -n fleet-default get clusters.fleet.cattle.io),
                                      # each a name or {name: ..., values: {...}} for per-cluster values, e.g.
                                      #   - onprem-prod-01
                                      #   - name: onprem-big-01
                                      #     values: {collection: {step: 15m}}
    clusterSelector: null             # label selector, e.g. {matchLabels: {resource-report: enabled}}
                                      # ({} = every cluster in the workspace, only when written explicitly)
    clusterGroup:                     # Fleet ClusterGroup; a plain name ("my-group") uses an existing group instead
      name: resource-report
      create: true                    # the chart creates the group in the workspace (false: it must exist)
      clusterNames:                   # Rancher cluster names (label management.cattle.io/cluster-display-name)
        - change-me                   # placeholder: matches no cluster
    namespace: resource-report        # spec.defaultNamespace: release namespace downstream (= publishNames.targetNamespace)
    releaseName: resource-report      # spec.helm.releaseName
    chart:
      repo: ""                        # spec.helm.repo: full OCI URL of the chart; "" = oci://<registry>/cdalar/cluster-resource-report-chart
                                      # (see registry above); set to override, e.g. oci://ghcr.io/cdalar/charts/cluster-resource-report
      version: ""                     # spec.helm.version; "" = this chart's version
    helmSecretName: ""                # spec.helmSecretName: secret in the workspace with registry credentials
                                      # (username/password), for a private registry or mirror
    insecureSkipTLSVerify: false      # spec.insecureSkipTLSVerify: skip TLS verification when Fleet downloads the
                                      # chart. Not for the image: containerd on the nodes pulls that (registries.yaml)
    # spec.helm.values: values for every downstream release, over these defaults taken from this release:
    # registry, image.repository, image.pullPolicy, imagePullSecrets, and rancher.namesConfigMap.enabled = publishNames.enabled.
    # Local-only settings (rancher.isLocalCluster, publishNames, deployDownstream, planner, capacityPlanner) are
    # always switched off downstream.
    values: {}
  # Downstream clusters: read the names from that ConfigMap (in namesConfigMap.namespace, default: the
  # release namespace). Grants get on exactly that ConfigMap. No token needed on the cluster.
  namesConfigMap:
    enabled: false
    namespace: ""
  # Menu entry in the Rancher UI (cluster explorer) that opens the dashboard through Rancher's proxy.
  # Created only where Rancher's NavLink CRD (ui.cattle.io/v1) exists.
  navLink:
    enabled: true
    label: Resource report
    # Menu group: the side menu shows one "Resource Allocation" entry, which opens a page with a card per link
    # (dashboard, and on the local cluster the two planners). "" = each link directly in the side menu.
    group: Resource Allocation
    # Card images (spec.iconSrc): "" = the chart's built-in icon (icons/*.svg, embedded as a data: URI), or your
    # own image URL / data: URI (JPEG, PNG or SVG; Rancher suggests 21 px high, at most 20 KB).
    icons:
      report: ""
      planner: ""
      capacity: ""
  # Downstream clusters, alternative: existing secret with a kubeconfig for the Rancher local (management) cluster, used to show
  # Rancher Project / cluster display names instead of IDs (p-xxxxx). Needs read on
  # projects.management.cattle.io and clusters.management.cattle.io.
  localKubeconfigSecret:
    name: ""
    key: kubeconfig
  localContext: ""   # context inside that kubeconfig (default: its current-context)

# The dashboard has no login of its own, so it is never exposed outside the cluster: the Service is always
# ClusterIP and the chart has no Ingress. Open it through the Rancher service proxy (menu entry, navLink above,
# with your Rancher login and RBAC) or kubectl port-forward.
service:
  port: 80

# Allocation planner (/planner): budgets and quotas per project and cluster, planned only -- nothing is applied
# to any cluster; the export is the allocation files for the Git/Terraform flow (docs/04). For the platform team,
# on the Rancher local cluster: on by default, but only runs with rancher.isLocalCluster (or
# rancher.localKubeconfigSecret) for the Rancher inventory; skipped on other clusters. The plan is kept in the ConfigMap <fullname>-planner (created empty by the chart, kept on uninstall);
# the planner may only get/update its own plan ConfigMaps. No volume or storage class needed.
planner:
  enabled: true

# Capacity planner (/capacity): the same without money -- no rates, budgets or costs; each project gets a CPU and
# memory envelope (its total across all clusters) instead. Own plan (ConfigMap <fullname>-capacity); same
# requirements and default as planner.enabled.
capacityPlanner:
  enabled: true

# Keep the latest report across pod restarts on a PVC (needs a storage class). Without it, a new pod starts with
# an empty dashboard until the first collection finishes. Not needed by the planners.
persistence:
  enabled: false
  storageClass: ""
  size: 1Gi

# Requests and limits on every container, so admission policies that require them (Kubewarden, Kyverno,
# Gatekeeper) accept the pods. The CPU limit only caps a collection run (parsing all pods), which then takes longer.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi    # raise for clusters with many thousands of pods

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# PriorityClass for the dashboard pod, so it is still scheduled on a full cluster: it preempts ordinary workloads
# (priority 0) instead of staying Pending. Kept below system-cluster-critical / system-node-critical.
priorityClass:
  create: true                        # create a PriorityClass named like the release (<fullname>) and use it
  value: 1000000
priorityClassName: ""                 # use this existing PriorityClass instead (the chart then creates none)
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
