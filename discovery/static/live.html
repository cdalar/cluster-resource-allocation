<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live resource view</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --track: #efeee9;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --accent-ink: #1c5cab;
  --hover: rgba(11,11,11,0.04);
  --use: rgba(11,11,11,0.55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --track: #262624;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --accent-ink: #86b6ef; --hover: rgba(255,255,255,0.05);
    --use: rgba(255,255,255,0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --track: #262624;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --accent-ink: #86b6ef; --hover: rgba(255,255,255,0.05);
  --use: rgba(255,255,255,0.6);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
.sub { color: var(--text-secondary); font-size: 13px; }
.muted { color: var(--text-muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { background: var(--hover); }
a { color: var(--accent-ink); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 10px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--hover); font-weight: 600; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--text-muted); }
.dot.live { background: var(--status-good); }
.dot.polling { background: var(--status-warning); }
.dot.down { background: var(--status-critical); }
.banner { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); margin-bottom: 12px; font-size: 13px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 4px 0 14px; font-size: 14px; }
.crumbs button { border: 0; background: none; padding: 2px 4px; color: var(--accent-ink); border-radius: 4px; }
.crumbs button:hover { background: var(--hover); }
.crumbs .here { font-weight: 600; padding: 2px 4px; }
.crumbs .sep { color: var(--text-muted); }
.kind { display: inline-block; font-size: 11px; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; margin-bottom: 16px; }
.tile .label { color: var(--text-secondary); font-size: 13px; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .unit { font-size: 13px; font-weight: 400; color: var(--text-secondary); }
.tile .note { font-size: 12px; color: var(--text-muted); margin-top: 2px; min-height: 17px; }
.tile .bar { margin-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }
.sw.lim { width: 2px; height: 12px; background: var(--text-primary); }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
/* bullet bar: track = the reference (allocatable), fill = requests, thin bar = usage, tick = limits */
.bar { position: relative; height: 12px; background: var(--track); border-radius: 3px; overflow: visible; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 3px 0 0 3px; }
.bar .use { position: absolute; left: 0; top: 4px; height: 4px; background: var(--use); border-radius: 0 2px 2px 0; }
.bar .lim { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text-primary); }
.bar .lim.over { background: var(--status-critical); }
.bar .fill.over { background: var(--status-critical); }
.nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.node { cursor: pointer; }
.node:hover { background: var(--hover); }
.node h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.node .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.node .row { display: grid; grid-template-columns: 52px 1fr 112px; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; }
.node .row .v { text-align: right; font-variant-numeric: tabular-nums; }
.warn { color: var(--status-critical); font-weight: 600; font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-secondary); }
.badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; vertical-align: middle; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
th { font-weight: 600; color: var(--text-secondary); cursor: pointer; position: sticky; top: 0; background: var(--surface-1); }
th[aria-sort]::after { content: " ▾"; color: var(--text-muted); }
th[aria-sort="ascending"]::after { content: " ▴"; }
td { font-variant-numeric: tabular-nums; }
td.bar-cell { min-width: 150px; }
td.bar-cell .bar { width: 100%; }
tbody tr.clickable { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
.empty { color: var(--text-muted); padding: 24px 0; text-align: center; }
.spread { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--grid); }
.spread-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 6px 24px; }
.spread-row { display: grid; grid-template-columns: minmax(80px, 180px) 1fr 32px; gap: 8px; align-items: center; font-size: 12px; }
.spread-row .v { text-align: right; font-variant-numeric: tabular-nums; }
.spread-row .bar .lim { background: var(--text-muted); }
.detail { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
.detail b { color: var(--text-primary); font-weight: 500; }
#tooltip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; min-width: 180px; }
#tooltip .t { color: var(--text-secondary); margin-bottom: 4px; }
#tooltip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
#tooltip .k { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
#tooltip .k i { width: 12px; height: 3px; display: inline-block; }
#tooltip b { font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .tile .value { font-size: 20px; } .node .row { grid-template-columns: 44px 1fr 96px; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <h1>Live resource view</h1>
      <div class="sub" id="meta">Loading…</div>
      <div class="sub muted" id="status"></div>
    </div>
    <div class="actions">
      <span class="sub">Group by</span>
      <div class="seg" id="by">
        <button type="button" data-by="node" aria-pressed="true">Nodes</button>
        <button type="button" data-by="project" aria-pressed="false">Projects</button>
      </div>
      <a href=".">Resource report</a>
      <button id="theme" type="button" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="tiles" id="tiles"></div>
  <div class="card">
    <div class="section-head">
      <div><h2 id="levelTitle"></h2><div class="sub" id="levelSub"></div></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--series-1)"></i>Requests</span>
        <span><i class="sw" style="background:var(--use); height:4px"></i>Used now</span>
        <span><i class="sw lim"></i>Limits</span>
        <span><i class="sw" style="background:var(--track); border:1px solid var(--axis)"></i>Allocatable</span>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="tooltip" role="tooltip"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const GIB = 2 ** 30, MIB = 2 ** 20;
const KINDS_ORDER = ["Deployment", "StatefulSet", "DaemonSet", "Job", "ReplicaSet", "ReplicationController", "StaticPod", "Pod"];
const KIND_LABEL = { StaticPod: "Static pod", Pod: "Pod (no controller)" };

// ---------- state ----------
const S = { seq: -1, nodes: new Map(), ns: new Map(), pods: new Map(), pdbs: new Map(), usage: {}, nodeUsage: {}, status: null, cluster: null };
// what is shown: group by node or project, then the chosen node / project (id) / namespace / workload ("Kind/name") / pod
const view = { by: "node", node: null, project: null, ns: null, wl: null, pod: null, sort: null, scale: "alloc" };   // scale: bars against the allocatable, or the largest row
const conn = { mode: "connecting", es: null, lastMsg: 0, lastUpdate: null, pollTimer: null, retryTimer: null, error: null };

// ---------- formatting (same rules as the report page: "." decimal, narrow space for thousands) ----------
const nf = (d) => { const f = new Intl.NumberFormat("en-US", { maximumFractionDigits: d, minimumFractionDigits: 0 });
  return { format: (n) => f.format(n).replace(/,/g, " ") }; };
const f0 = nf(0), f1 = nf(1), f2 = nf(2);
function smart(v) { return Math.abs(v) >= 100 ? f0.format(v) : Math.abs(v) >= 10 ? f1.format(v) : f2.format(v); }
function cpu(v) { return v === null || v === undefined ? "–" : v > 0 && v < 0.01 ? "<0.01" : smart(v); }
function mem(bytes) {
  if (bytes === null || bytes === undefined) return "–";
  if (bytes >= GIB) return `${smart(bytes / GIB)} Gi`;
  if (bytes >= MIB) return `${f0.format(bytes / MIB)} Mi`;
  return bytes > 0 ? `${f0.format(bytes / 1024)} Ki` : "0";
}
function pct(a, b) { return b > 0 ? `${f0.format(a / b * 100)} %` : "–"; }
function plural(n, word) { return `${f0.format(n)} ${word}${n === 1 ? "" : "s"}`; }
// "26.5 / 62.5 Gi": both in the unit of the larger value
function memPair(a, b) { const unit = b >= GIB || a >= GIB ? GIB : MIB; return `${smart(a / unit)} / ${smart(b / unit)} ${unit === GIB ? "Gi" : "Mi"}`; }
function ago(iso) {
  if (!iso) return "–";
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.round(s / 60)} min`;
  if (s < 86400) return `${Math.round(s / 3600)} h`;
  return `${Math.round(s / 86400)} d`;
}
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k === "onclick") e.addEventListener("click", v);
    else e.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined && c !== false) e.append(c);
  return e;
}

// ---------- tooltip ----------
const tip = $("#tooltip");
function showTip(evt, title, rows) {
  tip.replaceChildren(el("div", { class: "t", text: title }),
    ...rows.map(([color, label, value]) => el("div", { class: "r" },
      el("span", { class: "k" }, color ? el("i", { style: `background:${color}` }) : null, label), el("b", { text: value }))));
  tip.style.display = "block";
  moveTip(evt);
}
function moveTip(evt) {
  let x, y;
  if (evt.clientX !== undefined && evt.type !== "focus") { x = evt.clientX; y = evt.clientY; }
  else { const b = evt.target.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top; }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, x + 12) + "px";
  tip.style.top = Math.max(8, y - h - 12) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
function attachTip(node, fn) {
  node.setAttribute("tabindex", "0");
  node.addEventListener("pointerenter", fn);
  node.addEventListener("pointermove", moveTip);
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", fn);
  node.addEventListener("blur", hideTip);
}

// ---------- data: snapshot + changes ----------
const podKey = (p) => `${p.ns}/${p.name}`;
function applySnapshot(snap) {
  S.seq = snap.seq;
  S.nodes = new Map(snap.nodes.map((n) => [n.name, n]));
  S.ns = new Map(snap.namespaces.map((n) => [n.name, n]));
  S.pods = new Map(snap.pods.map((p) => [podKey(p), p]));
  S.pdbs = new Map((snap.pdbs || []).map((p) => [`${p.ns}/${p.name}`, p]));
  S.usage = snap.usage || {}; S.nodeUsage = snap.node_usage || {};
  S.status = snap.status; S.cluster = snap.status && snap.status.cluster;
  conn.lastUpdate = Date.now();
  scheduleRender();
}
function applyChanges(d) {
  if (d.reset) { resync(); return; }
  for (const [kind, map] of [["nodes", S.nodes], ["namespaces", S.ns], ["pods", S.pods], ["pdbs", S.pdbs]]) {
    for (const [k, v] of Object.entries(d[kind] || {})) { if (v === null) map.delete(k); else map.set(k, v); }
  }
  if (d.usage) { S.usage = d.usage; S.nodeUsage = d.node_usage || {}; }
  if (d.status) { S.status = d.status; S.cluster = d.status.cluster || S.cluster; }
  S.seq = d.seq;
  conn.lastUpdate = Date.now();
  scheduleRender();
}

// ---------- connection: snapshot, then Server-Sent Events; polling when the stream does not get through ----------
const STALL_MS = 45000;   // the server sends a ping every 15 s; nothing for this long = the stream is stuck (proxy buffering)
async function resync() {
  closeStream();
  try {
    const res = await fetch("api/live/snapshot", { cache: "no-store" });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    conn.error = null;
    applySnapshot(body);
    openStream();
  } catch (e) {
    conn.error = e.message; conn.mode = "down"; renderHeader();
    conn.retryTimer = setTimeout(resync, 10000);
  }
}
function openStream() {
  if (!("EventSource" in window)) return startPolling();
  conn.es = new EventSource(`api/live/stream?since=${S.seq}`);
  conn.lastMsg = Date.now();
  conn.es.addEventListener("changes", (e) => { conn.lastMsg = Date.now(); setMode("live"); applyChanges(JSON.parse(e.data)); });
  conn.es.addEventListener("ping", () => { conn.lastMsg = Date.now(); setMode("live"); });
  conn.es.addEventListener("open", () => { conn.lastMsg = Date.now(); setMode("live"); });
  conn.es.addEventListener("error", () => { if (conn.es && conn.es.readyState === EventSource.CLOSED) startPolling(); else setMode("reconnecting"); });
  conn.watchdog = setInterval(() => { if (Date.now() - conn.lastMsg > STALL_MS) startPolling(); }, 5000);
}
function closeStream() {
  if (conn.es) { conn.es.close(); conn.es = null; }
  clearInterval(conn.watchdog); clearTimeout(conn.pollTimer); clearTimeout(conn.retryTimer);
}
function startPolling() {
  closeStream();
  setMode("polling");
  const poll = async () => {
    try {
      const res = await fetch(`api/live/changes?since=${S.seq}`, { cache: "no-store" });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      conn.error = null;
      applyChanges(body);
      if (body.reset) return;
    } catch (e) { conn.error = e.message; setMode("down"); }
    conn.pollTimer = setTimeout(poll, 5000);
  };
  poll();
  conn.retryTimer = setTimeout(() => { if (conn.mode === "polling") { clearTimeout(conn.pollTimer); openStream(); } }, 60000);
}
function setMode(m) { if (conn.mode !== m) { conn.mode = m; renderHeader(); } }

// ---------- derived data ----------
const nsOf = (name) => S.ns.get(name) || { name, project_id: "", project: "", category: "unassigned" };
const projectKeyOf = (p) => nsOf(p.ns).project_id || "";
function projectLabel(pid) {
  if (!pid) return "Unassigned";
  for (const n of S.ns.values()) if (n.project_id === pid) return n.project || pid;
  return pid.split(":").pop();
}
const wlKey = (p) => `${p.owner_kind}/${p.owner}`;
function podUsage(p) {
  const u = S.usage[podKey(p)];
  if (!u) return null;
  let c = 0, m = 0, any = false;
  for (const ct of p.containers) { const v = u[ct.name]; if (v) { c += v[0]; m += v[1]; any = true; } }
  return any ? { cpu: c, mem: m } : null;
}
function scopedPods() {
  const out = [];
  for (const p of S.pods.values()) {
    if (view.by === "node" && view.node && p.node !== view.node) continue;
    if (view.project !== null && projectKeyOf(p) !== view.project) continue;
    if (view.ns && p.ns !== view.ns) continue;
    if (view.wl && wlKey(p) !== view.wl) continue;
    if (view.pod && p.name !== view.pod) continue;
    out.push(p);
  }
  return out;
}
function newAgg(key, label) {
  return { key, label, pods: 0, pending: 0, cpu_req: 0, mem_req: 0, cpu_lim: 0, mem_lim: 0, cpu_use: 0, mem_use: 0, used_known: 0, restarts: 0, nodes: new Set(), byNode: new Map() };
}
function addPod(a, p) {
  a.pods += 1; if (p.phase !== "Running") a.pending += 1;
  a.cpu_req += p.cpu_req; a.mem_req += p.mem_req; a.cpu_lim += p.cpu_lim; a.mem_lim += p.mem_lim;
  const u = podUsage(p);
  if (u) { a.cpu_use += u.cpu; a.mem_use += u.mem; a.used_known += 1; }
  for (const c of p.containers) a.restarts += c.restarts || 0;
  if (p.node) { a.nodes.add(p.node); a.byNode.set(p.node, (a.byNode.get(p.node) || 0) + 1); }
}
// how a workload's pods are spread over the schedulable nodes: counts per node (largest first, nodes without one
// of its pods as 0) and the skew (largest - smallest), the measure topologySpreadConstraints use (maxSkew)
function spread(a, kind) {
  const nodes = [...S.nodes.values()].filter((n) => n.ready && !n.unschedulable).map((n) => n.name);
  for (const n of a.byNode.keys()) if (!nodes.includes(n)) nodes.push(n);   // a pod on a cordoned node still counts
  const rows = nodes.map((n) => [n, a.byNode.get(n) || 0]).sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0]));
  const counts = rows.map((r) => r[1]);
  const skew = counts.length ? counts[0] - counts[counts.length - 1] : 0;
  // uneven: one node holds clearly more than its even share (9 pods on 3 nodes: 8/1/0 yes, 4/3/2 no; a few pods on
  // many nodes are never flagged for one node having two)
  const even = nodes.length ? Math.ceil(a.pods / nodes.length) : 0;
  const uneven = a.pods >= 2 && kind !== "DaemonSet" && kind !== "StaticPod" && skew > 1 && counts[0] > even + 1;
  return { rows, counts, skew, uneven, used: a.nodes.size, total: nodes.length };
}
// "What if the node with most of this workload's pods fails?" The remaining pods against the strictest
// PodDisruptionBudget that selects them (minAvailable, or expectedPods - maxUnavailable; percentages of the
// PDB's expected pods), or, without one, whether any pod is left at all.
function pdbRequired(p, pods) {
  const expected = p.expected_pods || pods;
  const num = (v) => (typeof v === "string" && v.endsWith("%") ? Math.ceil(parseFloat(v) / 100 * expected) : Number(v));
  if (p.min_available !== null && p.min_available !== undefined) return num(p.min_available);
  if (p.max_unavailable !== null && p.max_unavailable !== undefined) {
    const v = p.max_unavailable;
    return expected - (typeof v === "string" && v.endsWith("%") ? Math.floor(parseFloat(v) / 100 * expected) : Number(v));
  }
  return 0;
}
function nPlusOne(a, kind, pdbs) {
  if (kind === "DaemonSet" || kind === "StaticPod" || a.pods === 0) return { level: null, text: "–", detail: "one pod per node by design" };
  const sp = spread(a, kind);

    el("button", { type: "button", text: "allocatable", "aria-pressed": String(view.scale !== "max"), onclick: () => { view.scale = "alloc"; render(); } }),
    el("button", { type: "button", text: "largest row", "aria-pressed": String(view.scale === "max"), onclick: () => { view.scale = "max"; render(); } }));
  $("#levelSub").replaceChildren(`Bars against the ${barRef.label}${usageKnown() ? "" : " · usage n/a (no metrics-server)"}`, scale);
  $("#content").replaceChildren(...[lvl === "pods" ? renderSpread() : null,
    rows.length ? renderTable(rows, barRef, { cols, nameCell, onRow }) : el("div", { class: "empty", text: "No pods here any more" })].filter(Boolean));
}

// pods of this workload per node, over all nodes (also when the view is inside one node): 9 replicas on 3 nodes
// should read 3/3/3, not 8/1/0
function renderSpread() {
  const [kind] = view.wl.split("/");
  const { a, pdbs } = wholeWorkload(view.ns, view.wl);
  const sp = spread(a, kind);
  if (!sp.rows.length || a.pods < 1) return null;
  const n1 = nPlusOne(a, kind, pdbs);
  const max = Math.max(1, ...sp.counts);
  const ideal = sp.total ? a.pods / sp.total : 0;
  const last = sp.rows[sp.rows.length - 1];
  const note = kind === "DaemonSet" ? "one pod per node by design"
    : sp.uneven ? `uneven: ${sp.counts[0]} on ${sp.rows[0][0]}, ${last[1]} on ${last[0]} (skew ${sp.skew}; even would be about ${f1.format(ideal)} per node)`
    : `even (skew ${sp.skew}, about ${f1.format(ideal)} per node)`;
  return el("div", { class: "spread" },
    el("div", { class: "section-head" }, el("div", {}, el("h2", { text: `${plural(a.pods, "pod")} on ${plural(sp.counts.filter((c) => c > 0).length, "node")} of ${sp.total}` }),
      el("div", { class: `sub${sp.uneven ? " warn" : ""}`, text: (sp.uneven ? "⚠ " : "") + note }),
      el("div", { class: "sub", style: "margin-top:4px" }, el("span", { class: "badge" }, n1.level ? el("i", { style: `background:var(--status-${n1.level})` }) : null, el("b", { text: "N+1: " }), n1.detail),
        pdbs.length ? "" : (n1.level ? " · add a PodDisruptionBudget to protect it from voluntary disruptions (drains, upgrades)" : "")))),
    el("div", { class: "spread-rows" }, ...sp.rows.map(([node, n]) => el("div", { class: "spread-row" },
      el("span", { class: "muted", text: node }),
      el("div", { class: "bar" }, n ? el("div", { class: `fill${sp.uneven && n === sp.counts[0] ? " over" : ""}`, style: `width:${n / max * 100}%` }) : null,
        ideal > 0 ? el("div", { class: "lim", style: `left:calc(${Math.min(100, ideal / max * 100)}% - 1px)` }) : null),
      el("span", { class: "v", text: f0.format(n) })))));
}

function renderContainers(pods) {
  const p = pods[0];
  if (!p) { $("#levelTitle").textContent = "Pod gone"; $("#levelSub").textContent = ""; $("#content").replaceChildren(el("div", { class: "empty", text: "This pod no longer exists" })); return; }
  const u = S.usage[podKey(p)] || {};
  const rows = p.containers.map((c) => {
    const a = newAgg(c.name, c.name);
    a.pods = 1; a.cpu_req = c.cpu_req; a.mem_req = c.mem_req; a.cpu_lim = c.cpu_lim; a.mem_lim = c.mem_lim; a.restarts = c.restarts;
    if (u[c.name]) { a.cpu_use = u[c.name][0]; a.mem_use = u[c.name][1]; a.used_known = 1; }
    a.c = c;
    return a;
  });
  // bars relative to the largest value in this pod (a container is small against a node)
  const ref = { cpu: Math.max(...rows.map((a) => Math.max(a.cpu_req, a.cpu_lim, a.cpu_use)), 0), mem: Math.max(...rows.map((a) => Math.max(a.mem_req, a.mem_lim, a.mem_use)), 0), label: "largest value in this pod" };
  const ns = nsOf(p.ns);
  $("#levelTitle").textContent = plural(rows.length, "container");
  $("#levelSub").textContent = `Bars relative to the largest request, limit or usage in this pod${usageKnown() ? "" : " · usage n/a"}`;
  const detail = el("div", { class: "detail" },
    el("span", {}, "Namespace ", el("b", { text: p.ns }), ns.project ? ` · project ${ns.project}` : ""),
    el("span", {}, "Node ", el("b", { text: p.node || "not scheduled" })),
    el("span", {}, "Phase ", el("b", { text: p.phase })), el("span", {}, "QoS ", el("b", { text: p.qos || "–" })),
    el("span", {}, "Owner ", el("b", { text: `${KIND_LABEL[p.owner_kind] || p.owner_kind} ${p.owner}` })),
    p.started ? el("span", {}, "Started ", el("b", { text: `${ago(p.started)} ago` })) : null);
  const nameCell = (a) => el("span", {}, a.label, el("span", { class: "muted", text: a.c.image ? ` · ${a.c.image}` : "" }),
    !a.c.ready ? el("span", { class: "badge", style: "margin-left:8px" }, el("i", { style: "background:var(--status-warning)" }), "not ready") : null,
    a.restarts ? el("span", { class: "muted", text: ` · ${f0.format(a.restarts)} restarts` }) : null);
  $("#content").replaceChildren(detail, renderTable(rows, ref, { cols: LIST_COLS.filter((c) => c !== "pods"), nameCell, onRow: null }));
}

function render() {
  renderHeader();
  renderCrumbs();
  const lvl = level();
  const ref = reference();
  const pods = scopedPods();
  renderTiles(pods, ref);
  if (lvl === "nodes") renderNodes();
  else if (lvl === "containers") renderContainers(pods);
  else renderList(pods, ref, lvl);
  const b = $("#banner");
  if (!S.nodes.size && !S.pods.size && S.status) {
    const w = Object.values(S.status.watch || {});
    b.hidden = false;
    b.textContent = w.some((x) => x.state === "error") ? `Nothing to show yet: ${w.filter((x) => x.error).map((x) => x.error)[0]}` : "Waiting for the first list from the cluster…";
  } else b.hidden = true;
}

// ---------- wiring ----------
document.querySelectorAll("#by button").forEach((b) => b.addEventListener("click", () => setView({ by: b.dataset.by, node: null, project: null })));
$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) { /* storage unavailable */ }
});
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
setInterval(renderHeader, 5000);   // "updated … ago" keeps moving
readHash();
renderHeader();
resync();
</script>
</body>
</html>
