name: image

# Tests the discovery code and chart, then builds the cluster-resource-report image
# (linux/amd64 + linux/arm64) and pushes it to GHCR.
#   push to main  -> :main and :sha-<short>
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y and :latest (tag must match the chart appVersion)
#   manual run    -> same as the ref it runs on
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "discovery/**"
      - "charts/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cluster-resource-report

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Unit tests
        working-directory: discovery
        run: python -m unittest -v test_discover test_server

      - uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint charts/cluster-resource-report

      - name: Tag matches chart appVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version=$(awk -F'"' '/^appVersion:/ {print $2}' charts/cluster-resource-report/Chart.yaml)
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match chart appVersion ${app_version}"
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: discovery
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint kubectl "${IMAGE}:sha-${GITHUB_SHA::7}" version --client
          docker run --rm "${IMAGE}:sha-${GITHUB_SHA::7}" --help | head -3
