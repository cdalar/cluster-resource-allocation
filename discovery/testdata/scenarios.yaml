# Test scenarios for the resource dashboard and the planners: one namespace per situation they distinguish.
# Workloads only: apply-scenarios.sh creates the namespaces (with their Rancher Project, label or nothing), fills in
# ${BIG_CPU} from the node sizes and sizes the N+1 filler after the rest is running. See README.md for the table.
# Images: registry.k8s.io/pause (requests that are never used), busybox and python (real CPU / memory use).

# =====================================================================================================================
# Efficiency
# =====================================================================================================================
# Low efficiency: requests that are never used (pause containers) -- the typical over-requesting service
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: payments-api}
spec:
  replicas: 3
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: batch, namespace: payments-batch}
spec:
  replicas: 2
  selector: {matchLabels: {app: batch}}
  template:
    metadata: {labels: {app: batch}}
    spec:
      containers:
        - name: batch
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: 1, memory: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: crm-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: search, namespace: crm-search}
spec:
  replicas: 1
  selector: {matchLabels: {app: search}}
  template:
    metadata: {labels: {app: search}}
    spec:
      containers:
        - name: search
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 300m, memory: 1Gi}, limits: {cpu: 1, memory: 1Gi}}
---
# Good efficiency: burns its 200m request (capped by a CPU limit: ADR-0003), holds ~300 Mi of its 400 Mi
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: payments-worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: cpu
          image: busybox:1.37
          command: ["sh", "-c", "while true; do :; done"]
          resources: {requests: {cpu: 200m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}}
        - name: mem
          image: python:3.13-alpine
          command: ["python", "-c", "x = bytearray(300 * 1024 * 1024); import time; time.sleep(10**9)"]
          resources: {requests: {cpu: 10m, memory: 400Mi}, limits: {memory: 450Mi}}
---
# Uses more than it requests: requests 100m, burns 500m (capped by its CPU limit so it doesn't take a whole core)
apiVersion: apps/v1
kind: Deployment
metadata: {name: reports, namespace: crm-reports}
spec:
  replicas: 1
  selector: {matchLabels: {app: reports}}
  template:
    metadata: {labels: {app: reports}}
    spec:
      containers:
        - name: cpu
          image: busybox:1.37
          command: ["sh", "-c", "while true; do :; done"]
          resources: {requests: {cpu: 100m, memory: 32Mi}, limits: {cpu: 500m, memory: 64Mi}}

# =====================================================================================================================
# Resource standards (docs/02) and QoS
# =====================================================================================================================
---
# No requests or limits at all: BestEffort (standard S5), counted in "No CPU req" / "No mem"
apiVersion: apps/v1
kind: Deployment
metadata: {name: besteffort, namespace: crm-legacy}
spec:
  replicas: 1
  selector: {matchLabels: {app: besteffort}}
  template:
    metadata: {labels: {app: besteffort}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# CPU request only: no memory request and no memory limit (standard S2)
apiVersion: apps/v1
kind: Deployment
metadata: {name: nomem, namespace: crm-legacy}
spec:
  replicas: 1
  selector: {matchLabels: {app: nomem}}
  template:
    metadata: {labels: {app: nomem}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 50m}}
---
# Guaranteed QoS: requests = limits (the prod standard S3: memory limit = request)
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: payments-guaranteed}
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 100m, memory: 128Mi}}
---
# Limits far above requests: memory limit 16x and CPU limit 20x the request (limits overcommit)
apiVersion: apps/v1
kind: Deployment
metadata: {name: spiky, namespace: payments-overcommit}
spec:
  replicas: 2
  selector: {matchLabels: {app: spiky}}
  template:
    metadata: {labels: {app: spiky}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 1, memory: 1Gi}}

# =====================================================================================================================
# Effective pod requests (as the scheduler and ResourceQuota count them)
# =====================================================================================================================
---
# A large init container (300m) and a native sidecar (restartPolicy Always, 50m) next to the app (100m)
# -> the pod reserves max(300m, 100m + 50m) = 300m
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: payments-sidecar}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      initContainers:
        - name: migrate
          image: busybox:1.37
          command: ["sh", "-c", "sleep 2"]
          resources: {requests: {cpu: 300m, memory: 64Mi}, limits: {memory: 64Mi}}
        - name: proxy
          image: registry.k8s.io/pause:3.10
          restartPolicy: Always
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 32Mi}}
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 128Mi}}
---
# Pod overhead: a RuntimeClass adds 250m / 128Mi per pod on top of the containers' 100m / 64Mi.
# Handler "runc" is the default runtime of k3s, RKE2 and AKS; set OVERHEAD=0 to skip this scenario elsewhere.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: scenario-overhead
  labels: {resource-report/scenario: "true"}
handler: runc
overhead:
  podFixed: {cpu: 250m, memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sandboxed, namespace: payments-overhead}
spec:
  replicas: 1
  selector: {matchLabels: {app: sandboxed}}
  template:
    metadata: {labels: {app: sandboxed}}
    spec:
      runtimeClassName: scenario-overhead
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {memory: 64Mi}}

# =====================================================================================================================
# Requests over time: peaks above "now"
# =====================================================================================================================
---
# HPA: CPU load drives it from 1 towards 3 replicas (requests peak > requests now)
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: payments-hpa}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: cpu
          image: busybox:1.37
          command: ["sh", "-c", "while true; do :; done"]
          resources: {requests: {cpu: 100m, memory: 32Mi}, limits: {cpu: 150m, memory: 64Mi}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: web, namespace: payments-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
---
# CronJob: every 10 minutes 2 pods of 100m for 3 minutes -> short request peaks (Prometheus "CPU req peak")
apiVersion: batch/v1
kind: CronJob
metadata: {name: settle, namespace: payments-cron}
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      parallelism: 2
      completions: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: settle
              image: busybox:1.37
              command: ["sh", "-c", "sleep 180"]
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 128Mi}}

# =====================================================================================================================
# Pod phases and controllers
# =====================================================================================================================
---
# Pending: asks for more CPU than the largest node has (the script sets BIG_CPU) -> never scheduled
apiVersion: apps/v1
kind: Deployment
metadata: {name: big, namespace: payments-bigjob}
spec:
  replicas: 1
  selector: {matchLabels: {app: big}}
  template:
    metadata: {labels: {app: big}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: "${BIG_CPU}", memory: 1Gi}, limits: {memory: 1Gi}}
---
# A finished Job: completed pods are not counted
apiVersion: batch/v1
kind: Job
metadata: {name: nightly-export, namespace: payments-batch}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: export
          image: busybox:1.37
          command: ["sh", "-c", "echo done"]
          resources: {requests: {cpu: 200m, memory: 64Mi}, limits: {memory: 64Mi}}
---
# A failed Job: the failed pod is not counted either
apiVersion: batch/v1
kind: Job
metadata: {name: import, namespace: payments-failed}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import
          image: busybox:1.37
          command: ["sh", "-c", "echo failing; exit 1"]
          resources: {requests: {cpu: 200m, memory: 64Mi}, limits: {memory: 64Mi}}
---
# DaemonSet: one pod per node, so its requests grow with the number of nodes
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: agent, namespace: payments-agent}
spec:
  selector: {matchLabels: {app: agent}}
  template:
    metadata: {labels: {app: agent}}
    spec:
      containers:
        - name: agent
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {memory: 64Mi}}
---
# StatefulSet: counted like any other pod
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: payments-stateful}
spec:
  serviceName: db
  replicas: 2
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: db
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 256Mi}}

# =====================================================================================================================
# Namespace quotas (ResourceQuota / LimitRange)
# =====================================================================================================================
---
# Quota with headroom and a LimitRange: pods without values get the defaults (quota and LimitRange counts)
apiVersion: v1
kind: ResourceQuota
metadata: {name: quota, namespace: crm-quota}
spec:
  hard: {requests.cpu: "1", requests.memory: 1Gi, limits.memory: 2Gi, pods: "10"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: crm-quota}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app, namespace: crm-quota}
spec:
  replicas: 2
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# Quota used up: 3 replicas of 200m against 500m -> 2 pods run, the third is refused
# (ReplicaSet event FailedCreate "exceeded quota"): the team needs more quota than it has
apiVersion: v1
kind: ResourceQuota
metadata: {name: quota, namespace: crm-quota-full}
spec:
  hard: {requests.cpu: 500m, requests.memory: 1Gi, limits.memory: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app, namespace: crm-quota-full}
spec:
  replicas: 3
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {memory: 512Mi}}
---
# Quota without a LimitRange: a pod without requests is refused ("must specify requests.cpu"), one with requests runs
apiVersion: v1
kind: ResourceQuota
metadata: {name: quota, namespace: crm-quota-strict}
spec:
  hard: {requests.cpu: 500m, requests.memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: compliant, namespace: crm-quota-strict}
spec:
  replicas: 1
  selector: {matchLabels: {app: compliant}}
  template:
    metadata: {labels: {app: compliant}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 128Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: norequests, namespace: crm-quota-strict}
spec:
  replicas: 1
  selector: {matchLabels: {app: norequests}}
  template:
    metadata: {labels: {app: norequests}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10

# =====================================================================================================================
# Rancher Project quota (project "search"): search-app fits its namespace quota, search-batch is refused a pod.
# With a Rancher quota on the project (the script sets one when it creates the project), Rancher creates the
# namespace ResourceQuota and LimitRange itself; otherwise the script adds equivalent ones.
# =====================================================================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app, namespace: search-app}
spec:
  replicas: 2
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
---
# No resources: gets the project's container defaults (LimitRange)
apiVersion: apps/v1
kind: Deployment
metadata: {name: defaults, namespace: search-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: defaults}}
  template:
    metadata: {labels: {app: defaults}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: indexer, namespace: search-batch}
spec:
  replicas: 3
  selector: {matchLabels: {app: indexer}}
  template:
    metadata: {labels: {app: indexer}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 1Gi}}

# =====================================================================================================================
# Classification: platform (System), unassigned, Default
# =====================================================================================================================
---
# Project "platform-tools": the name contains "platform", so all its namespaces count as System (platform reserve)
apiVersion: apps/v1
kind: Deployment
metadata: {name: dns, namespace: platform-dns}
spec:
  replicas: 2
  selector: {matchLabels: {app: dns}}
  template:
    metadata: {labels: {app: dns}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 128Mi}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: shipper, namespace: platform-logging}
spec:
  selector: {matchLabels: {app: shipper}}
  template:
    metadata: {labels: {app: shipper}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
---
# In no project, but the name contains "ingress": System by the namespace regex
apiVersion: apps/v1
kind: Deployment
metadata: {name: controller, namespace: demo-ingress}
spec:
  replicas: 1
  selector: {matchLabels: {app: controller}}
  template:
    metadata: {labels: {app: controller}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
---
# In no project ("Unassigned namespaces")
apiVersion: apps/v1
kind: Deployment
metadata: {name: app, namespace: legacy-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 256Mi}}
---
# In Rancher's Default project
apiVersion: apps/v1
kind: Deployment
metadata: {name: try, namespace: sandbox}
spec:
  replicas: 1
  selector: {matchLabels: {app: try}}
  template:
    metadata: {labels: {app: try}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 128Mi}}

# =====================================================================================================================
# N+1: pause pods the script scales so that the projects' requests end just above what survives the largest node
# failing ("Room for projects (N+1)" turns red). 0 replicas here; see apply-scenarios.sh (N1_BREACH=0 to skip).
# =====================================================================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reserve, namespace: payments-reserve}
spec:
  replicas: 0
  selector: {matchLabels: {app: reserve}}
  template:
    metadata: {labels: {app: reserve}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 250m, memory: 64Mi}, limits: {memory: 64Mi}}
