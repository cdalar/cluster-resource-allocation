# allocations/projects/payments.yaml: one file per Rancher Project. Changes go by pull request.
project: payments             # Rancher Project display name (the same name on every cluster)
owners: [payments-lead@corp.example]
allocations:
  - cluster: onprem-prod-01
    cpu: 40                   # vCPU: requests.cpu of the whole Project on this cluster
    memory: 160Gi             # requests.memory; limits.memory = memory x memoryLimitFactor of the environment
    pods: 300                 # optional
    namespaceDefault:         # quota every namespace of the Project gets (Rancher needs it); the sum stays <= the Project
      cpu: 10
      memory: 40Gi
  - cluster: onprem-test-01
    cpu: 12
    memory: 48Gi
    namespaceDefault:
      cpu: 4
      memory: 16Gi
    containerDefault:         # optional: other container defaults than settings.yaml
      cpu: 50m
      memory: 128Mi
