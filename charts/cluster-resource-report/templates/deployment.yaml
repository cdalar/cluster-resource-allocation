{{- if dig "enabled" false (.Values.ingress | default dict) }}
{{- fail "ingress was removed in 0.4.1: the dashboard is only reachable through the Rancher service proxy (menu entry) or kubectl port-forward. Remove ingress.* from your values." }}
{{- end }}
{{- if and .Values.service.type (ne .Values.service.type "ClusterIP") }}
{{- fail "service.type was removed in 0.4.1: the Service is always ClusterIP (open the dashboard through the Rancher service proxy)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crr.fullname" . }}
  labels:
    {{- include "crr.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate   # single collector; also required for a ReadWriteOnce volume
  selector:
    matchLabels:
      {{- include "crr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "crr.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "crr.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "crr.priorityClassName" . }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: report
          image: {{ include "crr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=0.0.0.0:8080
            - --data-dir=/data
            - --interval={{ .Values.collection.interval }}
            - --window={{ .Values.collection.window }}
            - --step={{ .Values.collection.step }}
            {{- with .Values.clusterName }}
            - --cluster-name={{ . }}
            {{- end }}
            {{- with .Values.collection.projectLabel }}
            - --project-label={{ . }}
            {{- end }}
            {{- with .Values.collection.systemNamespaceRegex }}
            - {{ printf "--system-ns-regex=%s" . | quote }}
            {{- end }}
            {{- with .Values.collection.systemProjectRegex }}
            - {{ printf "--system-project-regex=%s" . | quote }}
            {{- end }}
            {{- if not .Values.prometheus.enabled }}
            - --prometheus=none
            {{- else if .Values.prometheus.url }}
            - --prom-url={{ .Values.prometheus.url }}
            {{- else }}
            - --prom-service={{ .Values.prometheus.service }}
            {{- end }}
            {{- if dig "namesConfigMap" "enabled" false .Values.rancher }}
            - --rancher-names-configmap={{ include "crr.namesNamespace" . }}/rancher-project-names
            {{- end }}
            {{- if include "crr.planner" . }}
            - --planner
            {{- end }}
            {{- if include "crr.capacityPlanner" . }}
            - --capacity-planner
            {{- end }}
            {{- if include "crr.planners" . }}
            - --plan-configmaps={{ .Release.Namespace }}/{{ include "crr.fullname" . }}
            {{- end }}
            {{- if include "crr.isLocal" . }}
            - --rancher-local-self
            {{- else if .Values.rancher.localKubeconfigSecret.name }}
            - --rancher-local-kubeconfig=/etc/rancher-local/kubeconfig
            {{- with .Values.rancher.localContext }}
            - --rancher-local-context={{ . }}
            {{- end }}
            {{- end }}
          env:
            # shown on the dashboard and planners
            - name: CHART_VERSION
              value: {{ .Chart.Version | quote }}
            - name: IMAGE_TAG
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
          {{- if and .Values.prometheus.enabled .Values.prometheus.url .Values.prometheus.tokenSecret.name }}
            - name: PROM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prometheus.tokenSecret.name }}
                  key: {{ .Values.prometheus.tokenSecret.key }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.rancher.localKubeconfigSecret.name }}
            - name: rancher-local
              mountPath: /etc/rancher-local
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "crr.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.rancher.localKubeconfigSecret.name }}
        - name: rancher-local
          secret:
            secretName: {{ .Values.rancher.localKubeconfigSecret.name }}
            items:
              - key: {{ .Values.rancher.localKubeconfigSecret.key }}
                path: kubeconfig
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
