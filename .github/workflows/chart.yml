name: chart

# Packages the Helm chart and pushes it to GHCR as an OCI artifact:
#   oci://ghcr.io/<owner>/charts/cluster-resource-report-chart:<version>   (chart name from Chart.yaml;
#   up to 0.6.2 the chart was named cluster-resource-report and lives at charts/cluster-resource-report)
#   tag vX.Y.Z   -> chart version X.Y.Z (tag must match the chart version and appVersion)
#   manual run   -> publishes the chart of an existing release tag (input `tag`), e.g. to republish it
# Then copied to Docker Hub as <ns>/cluster-resource-report-chart (dockerhub.yml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the chart of (e.g. v0.6.2)
        required: true

permissions:
  contents: read

env:
  CHART_DIR: charts/cluster-resource-report
  REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: azure/setup-helm@v5

      - name: Tag matches chart version and appVersion
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(awk '/^version:/ {print $2}' "$CHART_DIR/Chart.yaml")
          app_version=$(awk -F'"' '/^appVersion:/ {print $2}' "$CHART_DIR/Chart.yaml")
          if [ "v${version}" != "$tag" ] || [ "v${app_version}" != "$tag" ]; then
            echo "::error::tag $tag does not match chart version ${version} / appVersion ${app_version}"
            exit 1
          fi

      - name: Lint
        run: helm lint "$CHART_DIR"

      - name: Package
        run: helm package "$CHART_DIR" --destination dist

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/*.tgz "$REGISTRY"

      - name: Pull back
        run: |
          version=$(awk '/^version:/ {print $2}' "$CHART_DIR/Chart.yaml")
          name=$(awk '/^name:/ {print $2}' "$CHART_DIR/Chart.yaml")
          mkdir -p pulled
          helm pull "$REGISTRY/$name" --version "$version" --destination pulled
          helm template x "pulled/$name-$version.tgz" > /dev/null

  dockerhub:
    needs: chart
    uses: ./.github/workflows/dockerhub.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      what: chart
    secrets: inherit
