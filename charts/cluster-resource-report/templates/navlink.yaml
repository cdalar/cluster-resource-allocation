{{- if and (dig "navLink" "enabled" true .Values.rancher) (.Capabilities.APIVersions.Has "ui.cattle.io/v1/NavLink") }}
# Menu entry in the Rancher UI (cluster explorer) that opens the dashboard through Rancher's service proxy
apiVersion: ui.cattle.io/v1
kind: NavLink
metadata:
  name: {{ include "crr.fullname" . }}
  labels:
    {{- include "crr.labels" . | nindent 4 }}
spec:
  label: {{ dig "navLink" "label" "Resource report" .Values.rancher | quote }}
  {{- with dig "navLink" "group" "" .Values.rancher }}
  group: {{ . | quote }}
  {{- end }}
  iconSrc: {{ include "crr.navLinkIcon" (list . "report") | quote }}
  description: Requests, limits and usage per Rancher Project and namespace
  target: _blank
  toService:
    namespace: {{ .Release.Namespace }}
    name: {{ include "crr.fullname" . }}
    scheme: http
    port: {{ .Values.service.port | quote }}
    path: /
{{- if include "crr.planner" . }}
---
apiVersion: ui.cattle.io/v1
kind: NavLink
metadata:
  name: {{ include "crr.fullname" . }}-planner
  labels:
    {{- include "crr.labels" . | nindent 4 }}
spec:
  label: "Allocation planner"
  {{- with dig "navLink" "group" "" .Values.rancher }}
  group: {{ . | quote }}
  {{- end }}
  iconSrc: {{ include "crr.navLinkIcon" (list . "planner") | quote }}
  description: Plan budgets and quotas per project and cluster (planning only, nothing is applied)
  target: _blank
  toService:
    namespace: {{ .Release.Namespace }}
    name: {{ include "crr.fullname" . }}
    scheme: http
    port: {{ .Values.service.port | quote }}
    path: /planner
{{- end }}
{{- if include "crr.capacityPlanner" . }}
---
apiVersion: ui.cattle.io/v1
kind: NavLink
metadata:
  name: {{ include "crr.fullname" . }}-capacity
  labels:
    {{- include "crr.labels" . | nindent 4 }}
spec:
  label: "Capacity planner"
  {{- with dig "navLink" "group" "" .Values.rancher }}
  group: {{ . | quote }}
  {{- end }}
  iconSrc: {{ include "crr.navLinkIcon" (list . "capacity") | quote }}
  description: Plan CPU and memory per project and cluster, without money (planning only, nothing is applied)
  target: _blank
  toService:
    namespace: {{ .Release.Namespace }}
    name: {{ include "crr.fullname" . }}
    scheme: http
    port: {{ .Values.service.port | quote }}
    path: /capacity
{{- end }}
{{- end }}
