# allocations/settings.yaml: the clusters projects can get capacity on, and the rules per environment.
# Read by allocation/generate.py together with projects/*.yaml.

environments:
  prod:
    memoryLimitFactor: 1      # limits.memory = requests.memory (S3, docs/02)
  test:
    memoryLimitFactor: 2      # limits.memory up to 2x requests.memory
  dev:
    memoryLimitFactor: 2

# Defaults for containers without requests/limits (LimitRange in every namespace), unless a project sets its own
containerDefault:
  cpu: 100m
  memory: 256Mi               # request; the limit is memory x memoryLimitFactor

clusters:                     # name = the kubeconfig context / directory under build/
  prod-01:
    env: prod
    capacity:                 # what may be allocated in total: after N+1, platform and headroom (optional)
      cpu: 94.5
      memory: 372Gi
  test-01:
    env: test
    capacity:
      cpu: 60
      memory: 240Gi
